[project]
name = "dep-ml-products"
version = "0.0.2"
description = "MRD land-cover classification for Fiji (Digital Earth Pacific)"
requires-python = ">=3.12"
dependencies = [
    "affine",
    "boto3",
    "dask[distributed]",
    # TODO: Drop with src/ in T3. src/run_task.py imports it, and the Dockerfile smoke-tests src/print_tasks.py.
    "dea-tools",
    "dep-tools",
    "gdal==3.13.2",
    "geopandas",
    "joblib",
    "numpy",
    "odc-geo<0.6",
    "odc-stac<0.6",
    "pandas",
    "planetary-computer",
    "pystac",
    "pystac-client",
    "rasterio",
    "requests",
    # Pinned: models are pickled, so model training and classification must be upgraded together.
    "scikit-learn==1.9.1",
    "scipy",
    "shapely",
    "typer",
    "xarray",
]

[project.scripts]
mrd = "mrd.cli:app"

[tool.uv.sources]
dep-tools = { git = "https://github.com/digitalearthpacific/dep-tools.git", tag = "v0.5.3" }

[dependency-groups]
dev = [
    "folium>=0.20.0,<0.21.0",
    "ipykernel>=7.1.0,<8.0.0",
    "mapclassify>=2.0.0,<3.0.0",
    "matplotlib>=3.10.8,<4.0.0",
    "pytest>=9.0.2,<10.0.0",
    "ruff>=0.15.16,<0.16.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# src stays until T3 replaces it with mrd.
packages = ["mrd", "src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
