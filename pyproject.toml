[project]
name = "dep-ml-products"
version = "0.0.2"
description = "MRD (Mineral Resource Detection) land-cover classification for Fiji (Digital Earth Pacific)"
requires-python = ">=3.12"
dependencies = [
    "affine>=3.0.1,<4",
    "antimeridian>=0.4.9,<0.5",
    "boto3>=1.43.126,<2",
    "botocore>=1.43.126,<2",
    "dask[distributed]>=2026.8.0,<2027",
    "dep-tools",
    "geopandas>=1.2.0,<2",
    "joblib>=1.6.0,<2",
    "numpy>=2.5.4,<3",
    "odc-geo>=0.5.4,<0.6",
    "odc-stac>=0.5.3,<0.6",
    "pandas>=3.1.1,<4",
    "planetary-computer>=1.0.0,<2",
    "pystac>=1.16.0,<2",
    "pystac-client>=0.9.1,<0.10",
    "rasterio>=1.5.2,<2",
    "requests>=2.34.2,<3",
    "rustac>=0.9.19",
    # Pinned: models are pickled, so model training and classification must be upgraded together.
    "scikit-learn==1.9.1",
    "scipy>=1.18.1,<2",
    "shapely>=2.2.0,<3",
    "typer>=0.28.0,<0.29",
    "xarray>=2026.9.0,<2027",
]

[project.scripts]
mrd = "mrd.cli:app"

[tool.uv.sources]
dep-tools = { git = "https://github.com/digitalearthpacific/dep-tools.git", tag = "v0.5.3" }

[tool.uv]
# dep-tools declares gdal, but only its azure module (unused here) imports osgeo; the rasterio and fiona wheels bundle
# GDAL. Excluding it lets the Docker image use a plain Python base.
override-dependencies = ["gdal; sys_platform == 'never'"]

[dependency-groups]
dev = [
    "folium>=0.20.0,<0.21",
    "ipykernel>=7.4.0,<8",
    "mapclassify>=2.11.0,<3",
    "matplotlib>=3.11.2,<4",
    "pytest>=9.2.0,<10",
    "ruff>=0.15.22,<0.16",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mrd"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
